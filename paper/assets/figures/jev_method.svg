   <g id="text_1">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(29.620492 94.358391)">Vibration</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(32.859085 104.436422)">window</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(21.673773 114.514453)">Six statistics</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(17.487367 124.592484)">Shared state s</text>
   </g>
   <g id="text_2">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(139.37756 42.801609)">Fault presence</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(143.171623 52.879641)">Frozen Qwen</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(145.065842 62.957672)">Binary head</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(140.557404 73.082953)">r = P(fault | s)</text>
   </g>
   <g id="text_3">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(123.588185 142.593609)">Conditional fault type</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(143.171623 152.671641)">Frozen Qwen</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(137.498107 162.749672)">Fault-only head</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(126.641857 172.874953)">u = P(type | fault, s)</text>
   </g>
   <g id="text_4">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(281.365726 99.397406)">Code composition</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(294.024789 109.475437)">p(H) = 1 − r</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(283.264867 119.553469)">p(k) = r uₖ, k ∈ F</text>
   </g>
   <g id="text_5">
