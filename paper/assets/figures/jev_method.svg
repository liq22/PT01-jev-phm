   <g id="text_1">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(21.540938 89.695406)">Observed vibration</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(12.451641 99.773438)">Six measured statistics</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(19.170703 109.851469)">Shared input state s</text>
   </g>
   <g id="text_2">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(177.974297 45.788625)">Fault presence question</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(169.113516 55.866656)">Frozen Qwen + binary head</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(200.025703 65.991938)">r = P(fault | s)</text>
   </g>
   <g id="text_3">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(166.706719 133.304625)">Conditional identity question</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(161.908594 143.382656)">Frozen Qwen + fault-only head</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(186.110156 153.507937)">u = P(type | fault, s)</text>
   </g>
   <g id="text_4">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(363.879141 89.695406)">Code-owned composition</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(393.157266 99.773438)">p(H) = 1 − r</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(361.657266 109.851469)">p(k) = r uₖ for each fault k</text>
   </g>
   <g id="text_5">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(536.208047 89.695406)">Cost-based decision</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(521.280703 99.773438)">Calibrated leaf distribution</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(534.455156 109.851469)">Diagnosis or deferral</text>
   </g>
   <g id="text_6">
    <text style="fill: #43515c; font: 8px 'DejaVu Sans'; text-anchor: middle" x="231.66" y="98.8344" transform="rotate(-0 231.66 98.8344)">No answer exchange</text>
   </g>
   <g id="text_7">
    <text style="font: 8px 'DejaVu Sans'; text-anchor: middle" x="330.84" y="185.8356" transform="rotate(-0 330.84 185.8356)">Branches use diagnosis-derived supervision; they are not independently measured physical concepts.</text>
   </g>
  </g>
