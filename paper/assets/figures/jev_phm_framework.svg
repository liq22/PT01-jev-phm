ecision"><rect x="559" y="99" width="169" height="94" rx="8" fill="#e6f2ef" stroke="#21756f" stroke-width="1.25"/><text x="643.5" y="115" fill="#21756f" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.7" font-weight="700" text-anchor="middle">Typed fault decision</text><rect x="574" y="129" width="50" height="6" rx="1" fill="#378d9d" stroke="#378d9d" stroke-width="0"/><text x="633" y="135" fill="#22384a" font-family="DejaVu Sans, Arial, sans-serif" font-size="7.6" font-weight="400" text-anchor="start">p(healthy)</text><rect x="574" y="142" width="28" height="6" rx="1" fill="#8bbcb5" stroke="#8bbcb5" stroke-width="0"/><text x="633" y="148" fill="#22384a" font-family="DejaVu Sans, Arial, sans-serif" font-size="7.6" font-weight="400" text-anchor="start">p(fault 1)</text><rect x="574" y="155" width="16" height="6" rx="1" fill="#b4d9cf" stroke="#b4d9cf" stroke-width="0"/><text x="633" y="161" fill="#22384a" font-family="DejaVu Sans, Arial, sans-serif" font-size="7.6" font-weight="400" text-anchor="start">p(fault 2)</text><text x="643.5" y="184" fill="#22384a" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.4" font-weight="700" text-anchor="middle">label / defer (⊥)</text></g><line x1="148" y1="147" x2="157.7" y2="147" stroke="#22384a" stroke-width="1.55" stroke-linecap="round"/><path d="M 156.7 144 L 162 147 L 156.7 150 Z" fill="#22384a"/><line x1="283" y1="147" x2="292.7" y2="147" stroke="#22384a" stroke-width="1.55" stroke-linecap="round"/><path d="M 291.7 144 L 297 147 L 291.7 150 Z" fill="#22384a"/><line x1="405" y1="147" x2="414.7" y2="147" stroke="#22384a" stroke-width="1.55" stroke-linecap="round"/><path d="M 413.7 144 L 419 147 L 413.7 150 Z" fill="#22384a"/><line x1="545" y1="147" x2="554.7" y2="147" stroke="#22384a" stroke-width="1.55" stroke-linecap="round"/><path d="M 553.7 144 L 559 147 L 553.7 150 Z" fill="#22384a"/><g id="fault-candidate-description-route"><rect x="297" y="209" width="256" height="48" rx="8" fill="#f0eef7" stroke="#bacb