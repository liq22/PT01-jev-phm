 Arial, sans-serif" font-size="9.1" font-weight="700" text-anchor="middle">Fit &amp; select on sources</text><text x="640" y="361" fill="#22384a" font-family="DejaVu Sans, Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle">Θ*: source-only criterion</text><text x="640" y="371" fill="#546879" font-family="DejaVu Sans, Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle">inference uses selected model</text></g><line x1="180" y1="347" x2="190.7" y2="347" stroke="#22384a" stroke-width="1.55" stroke-linecap="round"/><path d="M 189.7 344 L 195 347 L 189.7 350 Z" fill="#22384a"/><line x1="346" y1="347" x2="356.7" y2="347" stroke="#22384a" stroke-width="1.55" stroke-linecap="round"/><path d="M 355.7 344 L 361 347 L 355.7 350 Z" fill="#22384a"/><line x1="537" y1="347" x2="547.7" y2="347" stroke="#22384a" stroke-width="1.55" stroke-linecap="round"/><path d="M 546.7 344 L 552 347 L 546.7 350 Z" fill="#22384a"/></g><g id="evidence-boundary"><text x="23" y="406" fill="#21756f" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="start">Scientific boundary:</text><text x="151" y="406" fill="#546879" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start">Earlier six-feature PU pilot and 46-feature conditional-KL simulation do not validate the full semantic pipeline.</text><text x="23" y="418" fill="#546879" font-family="DejaVu Sans, Arial, sans-serif" font-size="7.8" font-weight="400" text-anchor="start">Optional conditional KL is a separate simulated training candidate; selected λ=0 and step=0 in the archived run.</text></g></svg>
