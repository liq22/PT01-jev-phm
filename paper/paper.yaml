problem_definition:
  object: Vibration-based single-label fault diagnosis with semantically defined candidates
  environment: Proposed source-only cross-dataset transfer; completed pilot is PU bearing-disjoint classification only
  observation: Proposed bounded signal tokens and measurement metadata; existing pilot uses six temporal statistics
  task_or_decision: Candidate probabilities and explicit diagnosis-or-defer action
  failure_or_contradiction: Measurement shifts and incompatible label granularity are not resolved by removing response generation
  desired_understanding: When annotation-compatible supervision supports target diagnostic distinctions, and how readout changes the error-latency relation
research_state:
  central_question: See paper/STATUS.md A for the current scientific focus; the manuscript retains C4 transfer and C5 readout questions.
  current_claim_at_risk: See paper/STATUS.md B; the fixed P1 semantic readout has not achieved the source qualification required before excluded-target comparison.
  strongest_support: Native PU metadata supplies a scoped mapping counterexample; complete proof and original-source details are linked in paper/STATUS.md B.
  favored_explanation: See paper/STATUS.md A; component location alone discards dominance used by the actual source annotation.
  strongest_competing_explanation: See paper/STATUS.md A; a refined or explicitly dominant-location task may be valid but does not automatically demonstrate coarse-label learning.
  largest_unresolved_uncertainty: High source NLL and an update-cap winner leave semantic fitting adequacy unresolved; source-only geometry is a post-hoc diagnostic, not a confirmed cause. Native-value and assumed MFPT unit conventions are bound; CWRU is EXCLUDED BY USER.
  current_novelty_risk: Shared semantic readout and coarse-label foundations are prior art; the native counterexample is an applicability result, not demonstrated method superiority.
  most_informative_next_action: Follow the single bounded action in paper/STATUS.md E; do not restart completed E0/E1/E2.
  possible_outcomes_and_decisions: See paper/STATUS.md E; no parallel Goal or new run queue is introduced.
  stopping_condition: See paper/STATUS.md E; current empirical improvements remain untested and submission approvals remain pending.
main_claims:
  - claim_id: C1
    statement: The frozen pilot has no established primary NLL increment over direct Qwen or its attribution controls; rotation differences change sign.
    status: supported_bounded_negative_finding
    evidence: paper/assets/tables/jev_study_summary.json
    boundary: One PU cohort and six-statistic state; not a test of the proposed semantic method, equivalence, or cross-dataset transfer.
  - claim_id: C2
    statement: Pilot probability and decision metrics disagree; every calibrated primary Qwen arm defers all test windows at the declared cost.
    status: supported_observation
    evidence: paper/assets/tables/jev_metrics.csv
    boundary: Error cost 1 and deferral cost 0.25; no safety, maintenance, or expert-transfer benefit.
  - claim_id: C3
    statement: Shared amplitude preservation lowers pooled pilot E1 NLL for both representations; all four equal-bearing-minus-pooled calibration intervals include zero.
    status: supported_conditional_observation
    evidence: paper/assets/tables/jev_study_summary.json
    boundary: Primary-split preprocessing/calibration observation, not semantic learning or equivalence of weighting schemes.
  - claim_id: C4
    statement: Shared fault-description readout improves excluded-dataset diagnostic NLL beyond an indexed head on the same backbone under the approved P1 protocol.
    status: hypothesis_pending_validation
    evidence: paper/method/native_annotation_compatibility.md
    boundary: P1 uses PU's documented single-ring groups and user-assumed MFPT experiment units under the 19 October native-value revision. Real source export/smoke and 28 fits completed, but the best semantic candidate hit the update cap; external effects and timing remain UNTESTED and MFPT waveforms remain sealed. Native PU mixed/dominant counterexamples remain valid; the native-granularity subclaim is UNTESTED. CWRU is EXCLUDED BY USER.
  - claim_id: C5
    statement: Direct semantic readout provides a favorable diagnostic error-latency relation across compatible backbone instances.
    status: hypothesis_pending_validation
    evidence: paper/draft/main.md
    boundary: Mathematical zero-response-token and scoring-cost properties are not measured end-to-end benefits or validated backbone portability.
main_contributions:
  - contribution_id: CTR-001
    statement: Completed pilot attribution separates diagnostic question conditioning from ordinary hierarchy and another direct question, with a bounded negative result.
