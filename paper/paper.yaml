problem_definition:
  object: Single-channel vibration observations of industrial equipment
  environment: Closed-set supervised diagnosis; exact dataset and independent units require local verification
  observation: Six deterministic features from PHMFactory windows
  task_or_decision: Categorical fault probabilities and explicit cost-based deferral
  failure_or_contradiction: Window counts can weight calibration differently from a declared unit-uniform population
  desired_understanding: Whether unit-calibrated Qwen decisions improve on pooled calibration and competitive numeric controls
research_state:
  central_question: Does a typed Qwen3-0.6B decision layer provide useful unit-population probabilities beyond a calibrated numeric classifier?
  current_claim_at_risk: Unit-weighted calibration yields a meaningful held-out increment beyond ordinary temperature scaling
  strongest_support: Elementary objective identity and nine numerical/interface tests; no real PHM or Qwen evidence
  favored_explanation: Calibration weighting matters when unit counts and losses covary under a unit-uniform target
  strongest_competing_explanation: Ordinary calibration is sufficient and Qwen adds no value beyond the numeric state
  largest_unresolved_uncertainty: Real-data feasibility and effect on independently held-out units
  current_novelty_risk: Typing, classification heads, calibration, selective prediction, and PHM calibration are existing work
  most_informative_next_action: Execute E0 then the locked two-by-three comparison in paper/experiments/jev_goal.md
  possible_outcomes_and_decisions: Positive evidence supports a population-specific claim; null or negative evidence narrows the claim without result-driven reruns
  stopping_condition: Deliver the first valid paired comparison and update claims; no unmotivated experiment expansion
