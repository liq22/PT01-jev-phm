problem_definition:
  object: Single-channel vibration observations of industrial equipment
  environment: PU closed-set supervised dominant-category diagnosis on disjoint physical bearings
  observation: Six features from explicitly selected vibration windows; prospective full-coverage and amplitude-preserving protocols
  task_or_decision: Fault probabilities and explicit cost-based deferral
  failure_or_contradiction: Typed validity does not establish useful diagnosis; composition and evidence changes can confound apparent model gains
  desired_understanding: Whether scoped diagnostic judgments improve decisions beyond flat and factorized numerical and Qwen controls
research_state:
  central_question: Does question-conditioned decomposition provide useful PHM probabilities beyond direct prediction at comparable evidence, supervision and computation?
  current_claim_at_risk: The proposed PHM workflow provides an increment beyond ordinary hierarchy, calibration or additional model evaluations
  strongest_support: Existing objective identity and prior-PR numerical checks; community non-PHM studies motivate comparisons but supply no PHM effect evidence
  favored_explanation: Explicitly scoped judgments and coherent composition may aid the supervised PHM decision; unit calibration remains population-specific
  strongest_competing_explanation: A direct classifier, ordinary numerical hierarchy, or matched-call direct ensemble explains the whole benefit
  largest_unresolved_uncertainty: Whether real Qwen question-conditioned predictions improve on shared-representation hierarchy and matched-call direct controls
  current_novelty_risk: NanoJev already uses Qwen3-0.6B decision heads and atomic judgments with code; hierarchical selective classification and proper scoring are prior art
  most_informative_next_action: Verify the real full-coverage export and Qwen smoke, then execute the frozen E1/E2 and six rotation protocols
  possible_outcomes_and_decisions: Separate valid negative outcomes from infrastructure failure; credit hierarchy or added evidence when those controls explain the gain
  stopping_condition: Complete valid core comparisons and a full evidence-grounded manuscript, or report the minimum concrete evidence/resource gap without claiming paper completion
