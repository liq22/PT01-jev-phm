problem_definition:
  object: Vibration-based single-label fault diagnosis with semantically defined candidates
  environment: Proposed source-only cross-dataset transfer; completed pilot is PU bearing-disjoint classification only
  observation: Proposed bounded signal tokens and measurement metadata; existing pilot uses six temporal statistics
  task_or_decision: Candidate probabilities and explicit diagnosis-or-defer action
  failure_or_contradiction: Measurement shifts and incompatible label granularity are not resolved by removing response generation
  desired_understanding: When annotation-compatible supervision supports target diagnostic distinctions, and how readout changes the error-latency relation
research_state:
  central_question: Under measurement shift and verified source annotation coarsening, when does compatible supervision improve excluded-dataset NLL or classification error; independently, how does non-generative readout change the error-latency frontier at fixed information and source-only selection?
  current_claim_at_risk: The proposed semantic method adds a PHM-specific increment beyond conventional semantic matching and justified coarse-label learning
  strongest_support: Completed PU pilot remains negative; manuscript now includes a self-contained coarsening non-identifiability example, not a new guarantee or target-transfer result
  favored_explanation: Semantically correct supervision may avoid false fine labels; benefits require informative source distinctions and transferable signal relationships
  strongest_competing_explanation: Common label mapping or an ordinary semantic matcher explains any benefit; reduced decoding alone explains any latency change
  largest_unresolved_uncertainty: Native cross-dataset annotation compatibility and empirical benefit of the unimplemented semantic method
  current_novelty_risk: GLiClass includes shared semantic readout; YOTOnet studies target-free diagnosis; Cour and Fotakis establish partial/coarse-label foundations; no first-ever claim
  most_informative_next_action: Verify a native source/target fault vocabulary and implement the smallest compatible-label comparison in the existing runtime, then use the pending comparisons in manuscript Section 7
  possible_outcomes_and_decisions: Preserve C1-C3 as pilot-only; reject semantic-supervision claims if labels are already exact or controls explain gains; report negative transfer and latency-accuracy tradeoffs
  stopping_condition: Scientific-question, terminology, notation and manuscript revision complete; general-method validation and venue/author decisions remain pending
main_claims:
  - claim_id: C1
    statement: The frozen pilot has no established primary NLL increment over direct Qwen or its attribution controls; rotation differences change sign.
    status: supported_bounded_negative_finding
    evidence: paper/assets/tables/jev_study_summary.json
    boundary: One PU cohort and six-statistic state; not a test of the proposed semantic method, equivalence, or cross-dataset transfer.
  - claim_id: C2
    statement: Pilot probability and decision metrics disagree; every calibrated primary Qwen arm defers all test windows at the declared cost.
    status: supported_observation
    evidence: paper/assets/tables/jev_metrics.csv
    boundary: Error cost 1 and deferral cost 0.25; no safety, maintenance, or expert-transfer benefit.
  - claim_id: C3
    statement: Shared amplitude preservation lowers pooled pilot E1 NLL for both representations; all four equal-bearing-minus-pooled calibration intervals include zero.
    status: supported_conditional_observation
    evidence: paper/assets/tables/jev_study_summary.json
    boundary: Primary-split preprocessing/calibration observation, not semantic learning or equivalence of weighting schemes.
  - claim_id: C4
    statement: Verified annotation-compatible source supervision improves excluded-dataset diagnostic NLL or error beyond conventional semantic controls.
    status: hypothesis_pending_validation
    evidence: paper/draft/main.md
    boundary: No native cross-dataset mapping or experiment yet; coarse supervision alone cannot identify all finer states.
  - claim_id: C5
    statement: Direct semantic readout provides a favorable diagnostic error-latency relation across compatible backbone instances.
    status: hypothesis_pending_validation
    evidence: paper/draft/main.md
    boundary: Mathematical zero-response-token and scoring-cost properties are not measured end-to-end benefits or validated backbone portability.
main_contributions:
  - contribution_id: CTR-001
    statement: Completed pilot attribution separates diagnostic question conditioning from ordinary hierarchy and another direct question, with a bounded negative result.
    supporting_claims: [C1]
  - contribution_id: CTR-002
    statement: Completed pilot observation distinguishes preprocessing, probability quality and cost-based acceptance; coherent typing or lower ECE does not establish useful diagnosis here.
    supporting_claims: [C2, C3]
# C4-C5 remain hypotheses, not established empirical contributions.
